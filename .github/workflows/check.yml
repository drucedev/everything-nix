# Evaluates the flake on both host platforms (`nix flake check` skips outputs
# of incompatible systems, so the legs are complementary). --no-build: nothing
# is built on CI. macos-26-intel is the last x86_64-darwin label; if it queues
# forever, enable billing/larger runners on the account.
name: Check flake

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # A red leg must not cancel the other — their coverage differs.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - run: nix flake check --no-build -Lv
