name: Check flake

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086

      - run: nix flake check --no-build -Lv
